<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Viewport-Skalierung & Mobile App Tags für Veyo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0f1f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Veyo">
    
    <title>Veyo – NotenManager</title>
    
    <!-- PWA Web-Manifest & App-Icons -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon192.png">

    <!-- Verknüpfung mit deiner externen CSS-Datei -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- KOPFZEILE / NAVBAR -->
    <header class="header">
        <div class="header-left">
            <div style="position: relative;">
                <button class="menu-btn" id="menuToggle" aria-label="Menü öffnen">☰</button>
                <nav class="dropdown-menu" id="dropdownMenu">
                    <button class="dropdown-item" onclick="switchView('dashboard')">📊 Übersicht</button>
                    <button class="dropdown-item" onclick="switchView('calendar')">📅 Kalender</button>
                </nav>
            </div>
            <h1>Veyo</h1>
        </div>
    </header>

    <!-- HAUPTCONTAINER -->
    <div class="container">
        
        <!-- DASHBOARD-ANSICHT -->
        <main id="view-dashboard">
            <section class="dashboard">
                <div class="stat-card primary">
                    <h2>Gesamtdurchschnitt</h2>
                    <div class="stat-value" id="overall-avg">-</div>
                    <div class="small" id="overall-count">0 Noten eingetragen</div>
                </div>
                <div class="stat-card">
                    <h2>Beste(s) Fach</h2>
                    <div class="stat-subvalue" id="best-subject">-</div>
                    <div class="small" id="best-subject-avg">Schnitt: -</div>
                </div>
            </section>

            <section class="controls">
                <input type="text" id="search-input" placeholder="Fach suchen..." oninput="renderDashboard()">
                <button class="btn btn-primary" onclick="openModal('addSubjectModal')">+ Fach</button>
                <button class="btn btn-secondary" onclick="openModal('addGradeModal')">+ Note</button>
            </section>

            <section class="subjects-grid" id="subjects-grid">
                <!-- Dynamisch erzeugte Fächer-Karten erscheinen hier -->
            </section>
        </main>

        <!-- KALENDER-ANSICHT -->
        <section id="view-calendar" class="view-hidden">
            <button class="btn btn-secondary" style="margin-bottom: 1.5rem;" onclick="switchView('dashboard')">← Zurück</button>
            <h2 style="margin-bottom: 1rem;">Termine & Arbeiten</h2>
            <button class="btn btn-primary" style="margin-bottom: 1rem;" onclick="openModal('addEventModal')">+ Termin hinzufügen</button>
            <div id="events-list">
                <!-- Dynamisch erzeugte Termine erscheinen hier -->
            </div>
        </section>

    </div>

    <!-- MODALS / DIALOG-FENSTER -->

    <!-- Modal: Fach hinzufügen -->
    <div class="modal" id="addSubjectModal">
        <div class="modal-content">
            <h2>Fach hinzufügen</h2>
            <div class="form-group">
                <label for="subject-name">Name des Fachs</label>
                <input type="text" id="subject-name" placeholder="z. B. Mathematik">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('addSubjectModal')">Abbrechen</button>
                <button class="btn btn-primary" onclick="addSubject()">Speichern</button>
            </div>
        </div>
    </div>

    <!-- Modal: Note eintragen -->
    <div class="modal" id="addGradeModal">
        <div class="modal-content">
            <h2>Note eintragen</h2>
            <div class="form-group">
                <label for="grade-subject-select">Fach auswählen</label>
                <select id="grade-subject-select"></select>
            </div>
            <div class="form-group">
                <label for="grade-value">Note / Punkte</label>
                <input type="number" id="grade-value" step="0.1" placeholder="z. B. 2.0">
            </div>
            <div class="form-group">
                <label for="grade-weight">Gewichtung</label>
                <input type="number" id="grade-weight" value="1" step="0.5">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('addGradeModal')">Abbrechen</button>
                <button class="btn btn-primary" onclick="addGrade()">Eintragen</button>
            </div>
        </div>
    </div>

    <!-- Modal: Termin eintragen -->
    <div class="modal" id="addEventModal">
        <div class="modal-content">
            <h2>Termin eintragen</h2>
            <div class="form-group">
                <label for="event-title">Bezeichnung</label>
                <input type="text" id="event-title" placeholder="z. B. Mathe Schulaufgabe">
            </div>
            <div class="form-group">
                <label for="event-date">Datum</label>
                <input type="date" id="event-date">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('addEventModal')">Abbrechen</button>
                <button class="btn btn-primary" onclick="addEvent()">Speichern</button>
            </div>
        </div>
    </div>

    <!-- Verknüpfung mit deiner externen JavaScript-Datei -->
    <script src="script.js"></script>
</body>
</html>
